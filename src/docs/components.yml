components:
  schemas:
    # Common schema for User details
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
      example:
        id: 5ebac534954b54139806c112
        email: fake@example.com
        name: fake name
        role: user

    # Common schema for Token information
    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
        expires: 2020-05-12T16:18:04.793Z

    # Common schema for authentication tokens (access and refresh)
    AuthTokens:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/Token'
        refresh:
          $ref: '#/components/schemas/Token'

    # Common Error schema for handling errors
    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string
    
    # Common schema for Product details
    Product:
      type: object
      properties:
        id:
          type: string
        product_name:
          type: string
        product_detail:
          type: string
        images:
          type: array
          items:
            type: string
        price:
          type: number
        discount:
          type: number
        quantity:
          type: number
        status:
          type: string
          enum: [Active, Inactive]
        discountedPrice:
          type: number
      example:
        id: 5ebac534954b54139806c112
        product_name: Example Product
        product_detail: Description of the product
        images: ["http://example.com/image.jpg"]
        price: 100
        discount: 10
        quantity: 50
        status: Active
        discountedPrice: 90

    # Customer details with embedded data about the customer and pagination
    Customer:
      type: object
      properties:
        role:
          type: string
          example: "user"
        isEmailVerified:
          type: boolean
          example: false
        issued:
          type: boolean
          example: true
        blocked:
          type: boolean
          example: false
        status:
          type: boolean
          example: false
        _id:
          type: string
          example: "6784e6eab31173ee7dc09392"
        firstName:
          type: string
          example: "Customer"
        lastName:
          type: string
          example: "Twu"
        email:
          type: string
          example: "customer121@yopmail.com"
        age:
          type: string
          example: "12-07-2005"
        phone:
          type: string
          example: "+784521036"
        dl:
          type: string
          example: "8976456132123"
        address:
          type: string
          example: "654sad6as4d6 564as56d4as56d4as"
        tagId:
          type: object
          properties:
            _id:
              type: string
              example: "6784e708b31173ee7dc0939d"
            tagId:
              type: string
              example: "54333823"
            role:
              type: string
              example: "Floor Attendant"
        image:
          type: string
          example: "http://localhost:3001/uploads/1736415315913.jpeg"
        floorAttendant:
          type: object
          properties:
            _id:
              type: string
              example: "6780df7d001148ad4b6085ab"
            name:
              type: string
              example: "Attendant"
            email:
              type: string
              example: "attendant@yopmail.com"
        createdAt:
          type: string
          format: date-time
          example: "2025-01-13T10:11:54.663Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-01-13T10:17:10.855Z"
    
    # Response schema for paginated customer fetch results
    CustomerFetchedResponse:
      type: object
      properties:
        message:
          type: string
          example: "Customer Fetched"
        data:
          type: object
          properties:
            customers:
              type: array
              items:
                $ref: '#/components/schemas/Customer'
            pagination:
              type: object
              properties:
                currentPage:
                  type: integer
                  example: 1
                totalPages:
                  type: integer
                  example: 2
                totalRecords:
                  type: integer
                  example: 2
                pageSize:
                  type: integer
                  example: 1

    # Schema for Community Post
    CommunityPost:
      type: object
      properties:
        id:
          type: string
        post_desc:
          type: string
        media:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [image, video]
              url:
                type: string
              thumbnail:
                type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        published_at:
          type: string
          format: date-time
        created_by:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 5ebac534954b54139806c112
        post_desc: This is a community post.
        media: [{ "type": "image", "url": "/uploads/image.jpg" }]
        status: published
        published_at: 2020-05-12T16:18:04.793Z
        created_by: { "id": "5ebac534954b54139806c112", "name": "John Doe" }
        createdAt: 2020-05-12T16:18:04.793Z
        updatedAt: 2020-05-12T16:18:04.793Z

    # Schema for Meal
    Meal:
      type: object
      properties:
        id:
          type: string
        mealName:
          type: string
        category:
          type: string
          enum: [Breakfast, Lunch, Dinner, Snack]
        total:
          type: object
          properties:
            calories:
              type: number
            protein:
              type: number
            carbs:
              type: number
            fat:
              type: number
            fiber:
              type: number
            sugar:
              type: number
            sodium:
              type: number
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              portion:
                type: string
              calories:
                type: number
              protein:
                type: number
              carbs:
                type: number
              fat:
                type: number
        healthScore:
          type: number
        tips:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: "5ebac534954b54139806c112"
        mealName: "Healthy Bowl"
        category: "Lunch"
        total:
          calories: 500
          protein: 30
          carbs: 60
          fat: 15
        items:
          - name: "Rice"
            portion: "1 cup"
            calories: 200
            protein: 4
            carbs: 45
            fat: 0.5
        healthScore: 9
        tips: "Good balance of protein"
        createdAt: "2020-05-12T16:18:04.793Z"
        updatedAt: "2020-05-12T16:18:04.793Z"

    # Schema for Journal
    Journal:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 5ebac534954b54139806c112
        title: "My deep thoughts"
        content: "Today was a good day."
        userId: "5ebac534954b54139806c112"
        createdAt: "2020-05-12T16:18:04.793Z"
        updatedAt: "2020-05-12T16:18:04.793Z"

    # Schema for Content
    Content:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 5ebac534954b54139806c112
        title: "Privacy Policy"
        description: "This is the privacy policy."
        createdAt: "2020-05-12T16:18:04.793Z"
        updatedAt: "2020-05-12T16:18:04.793Z"

    # Schema for HelpAndSupport
    HelpAndSupport:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        message:
          type: string
        isResolved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 5ebac534954b54139806c112
        name: "John Doe"
        email: "john@example.com"
        phone: "1234567890"
        message: "I need help with my account."
        isResolved: false
        createdAt: "2020-05-12T16:18:04.793Z"
        updatedAt: "2020-05-12T16:18:04.793Z"
    # Schema for Notification
    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        channel:
          type: string
          enum: [email, push, system]
        type:
          type: string
          enum: [manual, automation]
        status:
          type: string
          enum: [pending, sent, failed]
        readBy:
           type: array
           items:
             type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 5ebac534954b54139806c112
        title: "Welcome"
        message: "Welcome to our app!"
        channel: "system"
        type: "automation"
        status: "sent"
        readBy: []
        createdAt: "2020-05-12T16:18:04.793Z"
        updatedAt: "2020-05-12T16:18:04.793Z"


    # Common Error responses
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
    
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
